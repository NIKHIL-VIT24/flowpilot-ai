<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FlowPilot AI</title><style>
:root{--bg:#f7f8fa;--card:#fff;--text:#172033;--muted:#7b8494;--line:#e7ebf0;--accent:#ff6b2c;--green:#159a64;--red:#d95353;--shadow:0 5px 22px rgba(24,32,48,.055)}*{box-sizing:border-box}body{margin:0;font:13px Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.card{background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 13px;font-weight:650;color:#566173}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.danger{color:var(--red)}.input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;outline:0}.input:focus{border-color:#ffad8c}.muted{color:var(--muted)}.toast{position:fixed;right:22px;bottom:22px;background:#172033;color:#fff;padding:12px 16px;border-radius:8px;z-index:50}.auth{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#fff7f2,#f7f8fa)}.authbox{width:min(430px,92vw);padding:34px}.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px}.mark{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff}.auth h1{margin:28px 0 8px;font-size:30px}.field{margin:14px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.error{color:var(--red);font-size:12px;margin-top:5px}.app{min-height:100vh}.side{position:fixed;left:0;top:0;bottom:0;width:224px;background:#fff;border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;z-index:20}.navtitle{font-size:10px;color:#a0a8b5;font-weight:800;margin:25px 9px 8px}.nav button{width:100%;border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:8px;color:#687284}.nav button.active{background:#fff3ed;color:var(--accent);font-weight:800;border-left:3px solid var(--accent)}.upgrade{margin-top:auto;padding:13px;background:#fff3ed;border:1px solid #ffd8c7;border-radius:9px}.main{margin-left:224px}.top{height:66px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:10}.top .search{width:270px}.user{display:flex;gap:10px;align-items:center}.avatar{width:32px;height:32px;border-radius:50%;background:#eee;display:grid;place-items:center;font-weight:800}.content{padding:28px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.head h1{margin:0;font-size:25px}.head p{margin:5px 0 0;color:var(--muted)}.actions{display:flex;gap:8px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat{padding:17px}.stat .label{color:var(--muted);font-size:12px}.stat .num{font-size:25px;font-weight:800;margin-top:8px}.grid2{display:grid;grid-template-columns:1.25fr .75fr;gap:14px;margin-top:14px}.panel{padding:18px}.panel h3{margin:0 0 15px}.chart{height:230px;display:flex;align-items:flex-end;gap:16px;padding:15px 8px 5px}.bar{flex:1;background:#ffb08c;border-radius:5px 5px 0 0;min-height:4px;position:relative}.bar span{position:absolute;top:-19px;left:50%;transform:translateX(-50%);font-size:10px}.bar small{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);white-space:nowrap;color:var(--muted)}table{width:100%;border-collapse:collapse}th,td{padding:11px 8px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--muted);font-size:11px}.badge{display:inline-block;padding:4px 8px;border-radius:20px;background:#f1f3f6;font-size:11px}.green{color:var(--green)}.red{color:var(--red)}.row{display:flex;gap:8px;align-items:center}.between{display:flex;justify-content:space-between;align-items:center}.empty{padding:35px;text-align:center;color:var(--muted)}.list{display:grid;gap:10px}.item{padding:14px}.switch{width:42px;height:24px;border-radius:20px;background:#d9dde4;padding:3px}.switch i{display:block;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}.switch.on{background:var(--accent)}.switch.on i{transform:translateX(18px)}.modal{position:fixed;inset:0;background:rgba(16,22,34,.4);display:grid;place-items:center;z-index:40}.modalbox{width:min(560px,92vw);max-height:90vh;overflow:auto;padding:20px}.mobile{display:none}@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}@media(max-width:700px){.side{transform:translateX(-100%);transition:.2s}.side.open{transform:none}.main{margin-left:0}.mobile{display:block}.top{padding:0 14px}.top .search{display:none}.content{padding:18px}.stats{grid-template-columns:1fr}.head{align-items:flex-start;gap:10px;flex-direction:column}}
</style></head><body><div id="root"></div><div id="toast" class="toast hidden"></div><script>
const API='/api';let token=localStorage.getItem('fp_token')||'';let me=null;let page='Dashboard';
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function api(path,opt={}){const h={'Content-Type':'application/json',...(opt.headers||{})};if(token)h.Authorization='Bearer '+token;let r=await fetch(API+path,{...opt,headers:h});if(r.status===401){token='';localStorage.removeItem('fp_token');renderAuth();throw Error('Session expired')}let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'Request failed');return d}
function toast(t){let x=$('#toast');x.textContent=t;x.classList.remove('hidden');setTimeout(()=>x.classList.add('hidden'),2600)}
function renderAuth(){document.body.innerHTML='<div class="auth"><div class="authbox card"><div class="logo"><div class="mark">✦</div>FlowPilot AI</div><h1>Sign in</h1><p class="muted">Real account + server database. No fake dashboard metrics.</p><form id="login"><div class="field"><label>Email</label><input class="input" id="email" type="email" required></div><div class="field"><label>Password</label><input class="input" id="pass" type="password" required></div><div id="err" class="error"></div><button class="btn primary" style="width:100%;margin-top:10px">Sign in</button></form><p class="muted" style="text-align:center">New here? <a href="#signup" style="color:var(--accent);font-weight:700">Create account</a></p></div></div>';$('#login').onsubmit=async e=>{e.preventDefault();$('#err').textContent='';try{let d=await api('/auth/login',{method:'POST',body:JSON.stringify({email:$('#email').value,password:$('#pass').value})});token=d.access_token;localStorage.setItem('fp_token',token);me=d.user;renderApp()}catch(x){$('#err').textContent=x.message}}}
function renderSignup(){document.body.innerHTML='<div class="auth"><div class="authbox card"><div class="logo"><div class="mark">✦</div>FlowPilot AI</div><h1>Create account</h1><form id="signup"><div class="field"><label>Name</label><input class="input" id="name" required></div><div class="field"><label>Email</label><input class="input" id="email" type="email" required></div><div class="field"><label>Password</label><input class="input" id="pass" type="password" minlength="8" required></div><div id="err" class="error"></div><button class="btn primary" style="width:100%;margin-top:10px">Create account</button></form><p class="muted" style="text-align:center"><a href="#login" style="color:var(--accent);font-weight:700">Back to login</a></p></div></div>';$('#signup').onsubmit=async e=>{e.preventDefault();try{let d=await api('/auth/register',{method:'POST',body:JSON.stringify({name:$('#name').value,email:$('#email').value,password:$('#pass').value})});token=d.access_token;localStorage.setItem('fp_token',token);me=d.user;renderApp()}catch(x){$('#err').textContent=x.message}}}
const nav=['Dashboard','Campaign','Workflow','Content Studio','Audience','Insights','Reports','Integrations','Billing','Settings','Help','Support'];
function shell(){return `<aside class="side" id="side"><div class="logo"><div class="mark">✦</div>FlowPilot AI</div><div class="navtitle">GENERAL</div><div class="nav">${nav.slice(0,5).map(n=>`<button class="${page===n?'active':''}" onclick="go('${n}')">${n}</button>`).join('')}</div><div class="navtitle">ANALYTICS</div><div class="nav">${nav.slice(5,7).map(n=>`<button class="${page===n?'active':''}" onclick="go('${n}')">${n}</button>`).join('')}</div><div class="navtitle">SETTING</div><div class="nav">${nav.slice(7,10).map(n=>`<button class="${page===n?'active':''}" onclick="go('${n}')">${n}</button>`).join('')}</div><div class="navtitle">SUPPORT</div><div class="nav">${nav.slice(10).map(n=>`<button class="${page===n?'active':''}" onclick="go('${n}')">${n}</button>`).join('')}</div><div class="upgrade"><b>Connected data only</b><p class="muted">Connect providers to load live marketing metrics.</p></div></aside><main class="main"><header class="top"><button class="btn mobile" onclick="$('#side').classList.toggle('open')">☰</button><input class="input search" placeholder="Search your workspace…" onkeydown="if(event.key==='Enter')toast('Use the page filters to search data')"><div class="user"><div class="avatar">${esc((me?.name||'A')[0].toUpperCase())}</div><b>${esc(me?.name||'Admin')}</b><button class="btn small" onclick="logout()">Logout</button></div></header><section class="content" id="content"></section></main>`}
async function renderApp(){try{if(!me)me=await api('/auth/me');document.body.innerHTML='<div class="app">'+shell()+'</div>';await renderPage()}catch(e){renderAuth()}}
function go(n){page=n;location.hash=n.toLowerCase().replaceAll(' ','-');renderApp()}
async function logout(){await api('/auth/logout',{method:'POST'}).catch(()=>{});token='';localStorage.removeItem('fp_token');location.hash='login';renderAuth()}
function fmt(v,suffix=''){return v==null?'—':Number(v).toLocaleString()+suffix}
async function renderPage(){let c=$('#content');c.innerHTML='<div class="card empty">Loading live data…</div>';try{if(page==='Dashboard')await dashboard(c);else if(page==='Campaign')await campaigns(c);else if(page==='Workflow')await workflows(c);else if(page==='Content Studio')await studio(c);else if(page==='Audience')await audience(c);else if(page==='Insights')await insights(c);else if(page==='Reports')await reports(c);else if(page==='Integrations')await integrations(c);else if(page==='Billing')billing(c);else if(page==='Settings')await settings(c);else help(c)}catch(e){c.innerHTML='<div class="card empty">'+esc(e.message)+'</div>'}}
async function dashboard(c){let d=await api('/dashboard');let vals=[['Total Leads',fmt(d.contacts)],['Email Open Rate',d.open_rate==null?'—':d.open_rate+'%'],['Conversion Rate',d.conversion_rate==null?'—':d.conversion_rate+'%'],['Active Automations',fmt(d.active_automations)]];let bars=Object.entries(d.channels);c.innerHTML=`<div class="head"><div><h1>Dashboard</h1><p>Live values from your FlowPilot database and connected events.</p></div><div class="actions"><button class="btn" onclick="renderPage()">Refresh</button><button class="btn primary" onclick="downloadSummary()">Export Summary</button></div></div><div class="stats">${vals.map(x=>`<div class="card stat"><div class="label">${x[0]}</div><div class="num">${x[1]}</div></div>`).join('')}</div><div class="grid2"><div class="card panel"><h3>Conversions by Channel</h3>${bars.length?`<div class="chart">${bars.map(([k,v])=>`<div class="bar" style="height:${Math.max(5,Math.min(100,v*10))}%"><span>${v}</span><small>${esc(k)}</small></div>`).join('')}</div>`:'<div class="empty">No campaign conversion events yet. Connect a provider or create real events through the API.</div>'}</div><div class="card panel"><h3>Data status</h3><p>${d.data_available?'Your workspace has real stored records.':'No marketing data yet.'}</p><p class="muted">FlowPilot never fills missing metrics with invented values.</p><button class="btn primary" onclick="go('Integrations')">Connect data source</button></div></div><div class="grid2"><div class="card panel"><h3>Recent Campaigns</h3>${d.campaigns.length?`<table><tr><th>Campaign</th><th>Channel</th><th>Status</th><th>Created</th></tr>${d.campaigns.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.channel)}</td><td><span class="badge">${esc(x.status)}</span></td><td>${new Date(x.created_at).toLocaleString()}</td></tr>`).join('')}</table>`:'<div class="empty">No campaigns created.</div>'}</div><div class="card panel"><div class="between"><h3>Record Real Event</h3><span class="badge">Manual data</span></div><p class="muted">Use this only for an event you actually received. Nothing is generated automatically.</p><form id="ef"><div class="field"><label>Event</label><select class="input" id="et"><option value="email_sent">Email sent</option><option value="email_open">Email opened</option><option value="conversion">Conversion</option></select></div><div class="field"><label>Channel</label><select class="input" id="ec"><option>Email</option><option>Google Ads</option><option>Meta Ads</option><option>SMS</option><option>Shopify</option><option>Google Analytics</option><option>Other</option></select></div><div class="field"><label>Value (₹, optional)</label><input class="input" id="ev" type="number" min="0" step="0.01" value="0"></div><button class="btn primary">Record event</button></form></div></div><div class="card panel" style="margin-top:14px"><div class="between"><h3>Recent Activity</h3><button class="btn small" onclick="renderPage()">Refresh</button></div>${d.recent_events?.length?`<table><tr><th>Event</th><th>Channel</th><th>Value</th><th>Time</th></tr>${d.recent_events.map(x=>`<tr><td>${esc(x.event_type.replaceAll('_',' '))}</td><td>${esc(x.channel||'—')}</td><td>${x.value?`₹${Number(x.value).toLocaleString()}`:'—'}</td><td>${new Date(x.occurred_at).toLocaleString()}</td></tr>`).join('')}</table>`:'<div class="empty">No events recorded yet.</div>'}</div>`;$('#ef').onsubmit=async e=>{e.preventDefault();try{await api('/events?event_type='+encodeURIComponent($('#et').value)+'&channel='+encodeURIComponent($('#ec').value)+'&value='+encodeURIComponent($('#ev').value||0),{method:'POST'});toast('Real event recorded');await dashboard(c)}catch(x){toast(x.message)}}}
async function downloadSummary(){let d=await api('/reports');let blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='flowpilot-report.json';a.click();URL.revokeObjectURL(a.href)}
async function campaigns(c){let rows=await api('/campaigns');c.innerHTML=`<div class="head"><div><h1>Campaigns</h1><p>Create, edit, measure and manage campaigns. All records are stored on the server.</p></div><button class="btn primary" onclick="openCampaign()">+ Create Campaign</button></div><div class="card panel">${rows.length?`<table><tr><th>Name</th><th>Channel</th><th>Status</th><th>Budget</th><th>Actions</th></tr>${rows.map(x=>`<tr><td><b>${esc(x.name)}</b><div class="muted">${esc(x.audience)}</div></td><td>${esc(x.channel)}</td><td><span class="badge">${esc(x.status)}</span></td><td>₹${Number(x.budget).toLocaleString()}</td><td><button class="btn small" onclick="openCampaign(${x.id})">Edit</button> <button class="btn small danger" onclick="delCampaign(${x.id})">Delete</button></td></tr>`).join('')}</table>`:'<div class="empty">No campaigns yet.</div>'}</div>`}
function openCampaign(id){(async()=>{let x={name:"",channel:"Email",status:"Draft",audience:"All contacts",budget:0,impressions:0,clicks:0,conversions:0,spend:0,revenue:0};if(id){let rows=await api('/campaigns');x=rows.find(r=>r.id===id)||x}modal(`<h3>${id?'Edit':'Create'} Campaign</h3><form id="cf"><div class="field"><label>Name</label><input class="input" id="cn" value="${esc(x.name)}" required></div><div class="field"><label>Channel</label><select class="input" id="cc">${['Email','Meta Ads','Google Ads','SMS','Slack','Shopify'].map(v=>`<option ${x.channel===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Status</label><select class="input" id="cs">${['Draft','Scheduled','Active','Paused','Completed'].map(v=>`<option ${x.status===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Audience</label><input class="input" id="ca" value="${esc(x.audience)}"></div><div class="field"><label>Budget (₹)</label><input class="input" id="cb" type="number" min="0" step="0.01" value="${x.budget}"></div><div class="grid2"><div class="field"><label>Impressions</label><input class="input" id="ci" type="number" min="0" value="${x.impressions}"></div><div class="field"><label>Clicks</label><input class="input" id="ck" type="number" min="0" value="${x.clicks}"></div><div class="field"><label>Conversions</label><input class="input" id="cv" type="number" min="0" value="${x.conversions}"></div><div class="field"><label>Spend (₹)</label><input class="input" id="sp" type="number" min="0" step="0.01" value="${x.spend}"></div><div class="field"><label>Revenue (₹)</label><input class="input" id="rv" type="number" min="0" step="0.01" value="${x.revenue}"></div></div><button class="btn primary">${id?'Save changes':'Create campaign'}</button></form>`);$('#cf').onsubmit=async e=>{e.preventDefault();let body={name:$('#cn').value,channel:$('#cc').value,status:$('#cs').value,audience:$('#ca').value,budget:+$('#cb').value,impressions:+$('#ci').value,clicks:+$('#ck').value,conversions:+$('#cv').value,spend:+$('#sp').value,revenue:+$('#rv').value};await api(id?'/campaigns/'+id:'/campaigns',{method:id?'PATCH':'POST',body:JSON.stringify(body)});closeModal();toast(id?'Campaign updated':'Campaign created');renderPage()}})()}
async function delCampaign(id){if(!confirm('Delete this campaign?'))return;await api('/campaigns/'+id,{method:'DELETE'});toast('Deleted');renderPage()}
async function workflows(c){let rows=await api('/workflows');c.innerHTML=`<div class="head"><div><h1>Workflows</h1><p>Server-persisted automation definitions.</p></div><button class="btn primary" onclick="openWorkflow()">+ New Workflow</button></div><div class="list">${rows.length?rows.map(x=>`<div class="card item between"><div><b>${esc(x.name)}</b><div class="muted">Trigger: ${esc(x.trigger)} · ${x.actions.length} action(s)</div></div><div class="row"><button class="switch ${x.active?'on':''}" onclick="toggleWorkflow(${x.id},${!x.active})"><i></i></button><button class="btn small danger" onclick="delWorkflow(${x.id})">Delete</button></div></div>`).join(''):'<div class="card empty">No workflows yet.</div>'}</div>`}
function openWorkflow(){modal(`<h3>New Workflow</h3><form id="wf"><div class="field"><label>Name</label><input class="input" id="wn" required></div><div class="field"><label>Trigger</label><input class="input" id="wt" placeholder="New contact joins audience" required></div><div class="field"><label>Actions (comma separated)</label><input class="input" id="wa" placeholder="Send email, Notify Slack"></div><button class="btn primary">Save</button></form>`);$('#wf').onsubmit=async e=>{e.preventDefault();await api('/workflows',{method:'POST',body:JSON.stringify({name:$('#wn').value,trigger:$('#wt').value,actions:$('#wa').value.split(',').map(x=>x.trim()).filter(Boolean)})});closeModal();renderPage()}}
async function toggleWorkflow(id,active){await api('/workflows/'+id,{method:'PATCH',body:JSON.stringify({active})});renderPage()}async function delWorkflow(id){if(confirm('Delete workflow?')){await api('/workflows/'+id,{method:'DELETE'});renderPage()}}
async function studio(c){let drafts=await api('/drafts');c.innerHTML=`<div class="head"><div><h1>Content Studio</h1><p>Generate marketing copy locally, or use OpenAI when an API key is configured. Save drafts to the database.</p></div></div><div class="grid2"><div class="card panel"><h3>AI Generator</h3><div class="field"><label>Channel</label><select class="input" id="ach"><option>Email</option><option>LinkedIn</option><option>Instagram</option><option>Blog</option><option>Ad</option></select></div><div class="field"><label>Prompt</label><textarea class="input" id="ap" rows="6" placeholder="Describe the campaign and audience…"></textarea></div><button class="btn primary" onclick="generate()">Generate</button><div id="out" style="white-space:pre-wrap;margin-top:15px"></div></div><div class="card panel"><h3>Saved Drafts</h3>${drafts.length?drafts.map(x=>`<div class="item" style="border-bottom:1px solid var(--line)"><b>${esc(x.title)}</b><div class="muted">${esc(x.channel)} · ${new Date(x.created_at).toLocaleString()}</div><p>${esc(x.body.slice(0,180))}</p><button class="btn small danger" onclick="delDraft(${x.id})">Delete</button></div>`).join(''):'<div class="empty">No drafts saved.</div>'}</div></div>`}
async function generate(){let o=$('#out');o.textContent='Generating…';try{let d=await api('/ai/generate',{method:'POST',body:JSON.stringify({prompt:$('#ap').value,channel:$('#ach').value})});o.innerHTML=esc(d.text)+'<br><br><button class="btn" onclick="saveGenerated()">Save Draft</button>';window.generated=d.text}catch(e){o.textContent=e.message}}async function saveGenerated(){await api('/drafts',{method:'POST',body:JSON.stringify({title:'AI Draft',channel:$('#ach').value,body:window.generated||''})});toast('Draft saved');renderPage()}async function delDraft(id){if(confirm('Delete draft?')){await api('/drafts/'+id,{method:'DELETE'});renderPage()}}
async function audience(c){let rows=await api('/contacts');c.innerHTML=`<div class="head"><div><h1>Audience</h1><p>Real contacts stored in the database.</p></div><button class="btn primary" onclick="openContact()">+ Add Contact</button></div><div class="card panel"><input class="input" placeholder="Search contacts…" oninput="searchContacts(this.value)"><div id="ct">${contactTable(rows)}</div></div>`}function contactTable(rows){return rows.length?`<table><tr><th>Name</th><th>Email</th><th>Source</th><th>Status</th><th></th></tr>${rows.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.email)}</td><td>${esc(x.source)}</td><td>${esc(x.status)}</td><td><button class="btn small danger" onclick="delContact(${x.id})">Delete</button></td></tr>`).join('')}</table>`:'<div class="empty">No contacts found.</div>'}async function searchContacts(q){$('#ct').innerHTML=contactTable(await api('/contacts?search='+encodeURIComponent(q)))}function openContact(){modal(`<h3>Add Contact</h3><form id="cf2"><div class="field"><label>Name</label><input class="input" id="n" required></div><div class="field"><label>Email</label><input class="input" id="e" type="email" required></div><div class="field"><label>Source</label><input class="input" id="s" value="Manual"></div><button class="btn primary">Save</button></form>`);$('#cf2').onsubmit=async e=>{e.preventDefault();await api('/contacts',{method:'POST',body:JSON.stringify({name:$('#n').value,email:$('#e').value,source:$('#s').value})});closeModal();renderPage()}}async function delContact(id){if(confirm('Delete contact?')){await api('/contacts/'+id,{method:'DELETE'});renderPage()}}
async function insights(c){let d=await api('/analytics');c.innerHTML=`<div class="head"><div><h1>Insights</h1><p>Aggregated from real events recorded in your workspace.</p></div></div><div class="stats"><div class="card stat"><div class="label">Total events</div><div class="num">${d.total_events}</div></div><div class="card stat"><div class="label">Revenue events</div><div class="num">₹${d.revenue.toLocaleString()}</div></div></div><div class="grid2"><div class="card panel"><h3>Event types</h3>${Object.keys(d.events).length?Object.entries(d.events).map(([k,v])=>`<p class="between"><span>${esc(k)}</span><b>${v}</b></p>`).join(''):'<div class="empty">No events recorded.</div>'}</div><div class="card panel"><h3>Channels</h3>${Object.keys(d.channels).length?Object.entries(d.channels).map(([k,v])=>`<p class="between"><span>${esc(k)}</span><b>${v}</b></p>`).join(''):'<div class="empty">No channel events recorded.</div>'}</div></div>`}
async function reports(c){let rows=await api('/reports');c.innerHTML=`<div class="head"><div><h1>Reports</h1><p>Calculated from stored campaign metrics — blanks remain blank when no data exists.</p></div></div><div class="card panel">${rows.length?`<table><tr><th>Campaign</th><th>CTR</th><th>Conversions</th><th>Spend</th><th>Revenue</th><th>ROI</th></tr>${rows.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.ctr==null?'—':x.ctr+'%'}</td><td>${x.conversions}</td><td>₹${x.spend}</td><td>₹${x.revenue}</td><td>${x.roi==null?'—':x.roi+'%'}</td></tr>`).join('')}</table>`:'<div class="empty">No campaign report data yet.</div>'}</div>`}
async function integrations(c){
 let rows=await api('/integrations');
 let map=Object.fromEntries(rows.map(x=>[x.provider,x]));
 let google=map.Google||{connected:false};
 let shopify=map.Shopify||{connected:false};
 c.innerHTML=`<div class="head"><div><h1>Integrations</h1><p>Real provider connections. No fake metrics are generated.</p></div></div>
 <div class="grid2">
  <div class="card panel"><div class="between"><h3>Google</h3><span class="badge ${google.connected?'green':''}">${google.connected?'Connected':'Not connected'}</span></div>
   <p class="muted">One Google OAuth connection can provide Gmail, GA4 and Google Ads access. Reconnect after enabling a new scope.</p>
   <div class="row"><button class="btn primary" onclick="connectGoogle()">${google.connected?'Reconnect Google':'Connect Google'}</button>${google.connected?'<button class="btn danger" onclick="disconnect(\'Google\')">Disconnect</button>':''}</div>
  </div>
  <div class="card panel"><div class="between"><h3>Shopify</h3><span class="badge ${shopify.connected?'green':''}">${shopify.connected?'Connected':'Not connected'}</span></div>
   <p class="muted">Connect your Shopify store through Shopify OAuth and sync real orders and customers.</p>
   <div class="row"><button class="btn primary" onclick="connectShopify()">${shopify.connected?'Reconnect Shopify':'Connect Shopify'}</button>${shopify.connected?'<button class="btn" onclick="syncShopify()">Sync Store</button><button class="btn danger" onclick="disconnect(\'Shopify\')">Disconnect</button>':''}</div>
  </div>
  ${google.connected?`<div class="card panel"><h3>Google Analytics 4</h3><p class="muted">Read real GA4 reporting data for the property you authorize.</p><div class="field"><label>GA4 Property ID</label><input class="input" id="ga4pid" placeholder="123456789"></div><div class="row"><button class="btn" onclick="saveGA4()">Save Property</button><button class="btn primary" onclick="syncGA4()">Sync GA4</button></div></div>`:''}
  ${google.connected?`<div class="card panel"><h3>Google Ads</h3><p class="muted">Import real campaign impressions, clicks, conversions, spend and conversion value for the last 30 days.</p><div class="field"><label>Customer ID</label><input class="input" id="gadsid" placeholder="1234567890"></div><div class="field"><label>Manager/Login Customer ID (optional)</label><input class="input" id="gadsmgr" placeholder="1234567890"></div><div class="row"><button class="btn" onclick="saveGoogleAds()">Save Account</button><button class="btn primary" onclick="syncGoogleAds()">Sync Google Ads</button></div></div>`:''}
  <div class="card panel"><h3>Other providers</h3><p class="muted">Meta Ads, Slack and Mailchimp are intentionally shown as not connected until their official OAuth/API credentials are configured. FlowPilot will never turn a fake toggle into a connected provider.</p></div>
 </div>`;
}
async function connectGoogle(){let d=await api('/integrations/google/connect');location.href=d.authorization_url}
function connectShopify(){modal(`<h3>Connect Shopify</h3><p class="muted">Enter your store domain, for example <b>your-store.myshopify.com</b>.</p><div class="field"><label>Store domain</label><input class="input" id="shop" placeholder="your-store.myshopify.com" required></div><button class="btn primary" onclick="startShopify()">Continue to Shopify</button>`)}
async function startShopify(){let shop=$('#shop').value.trim();if(!shop)return toast('Enter your Shopify store domain');let d=await api('/integrations/shopify/connect?shop='+encodeURIComponent(shop));location.href=d.authorization_url}
async function saveGA4(){let id=$('#ga4pid').value.trim();if(!id)return toast('Enter your GA4 Property ID');await api('/integrations/google/analytics/config?property_id='+encodeURIComponent(id),{method:'POST'});toast('GA4 property saved')}
async function syncGA4(){toast('Syncing GA4…');let d=await api('/integrations/google/analytics/sync',{method:'POST'});toast('GA4 imported '+d.days_imported+' daily rows');renderPage()}
async function saveGoogleAds(){let id=$('#gadsid').value.trim();if(!id)return toast('Enter your Google Ads customer ID');let mgr=$('#gadsmgr').value.trim();let url='/integrations/google/ads/config?customer_id='+encodeURIComponent(id)+(mgr?'&login_customer_id='+encodeURIComponent(mgr):'');await api(url,{method:'POST'});toast('Google Ads account saved')}
async function syncGoogleAds(){toast('Syncing Google Ads…');let d=await api('/integrations/google/ads/sync',{method:'POST'});toast('Updated '+d.campaigns_updated+' Google Ads campaigns');renderPage()}
async function syncShopify(){toast('Syncing Shopify…');let d=await api('/integrations/shopify/sync',{method:'POST'});toast('Shopify sync imported '+d.orders_imported+' orders');renderPage()}
async function disconnect(p){if(confirm('Disconnect '+p+'?')){await api('/integrations/'+encodeURIComponent(p),{method:'DELETE'});renderPage()}}

function billing(c){c.innerHTML='<div class="head"><div><h1>Billing</h1><p>Billing UI is separated from data analytics. No fake payment status is displayed.</p></div></div><div class="card panel"><h3>Plan</h3><p>Your account is currently on the application default plan.</p><button class="btn primary" onclick="toast(\'Stripe checkout requires your Stripe account keys and price ID.\')">Configure Stripe</button></div>'}
async function settings(c){c.innerHTML=`<div class="head"><div><h1>Settings</h1><p>Account settings are stored in the server database.</p></div></div><div class="card panel"><form id="sf"><div class="field"><label>Name</label><input class="input" id="sn" value="${esc(me.name)}"></div><div class="field"><label>Email</label><input class="input" id="se" type="email" value="${esc(me.email)}"></div><label><input id="nt" type="checkbox" ${me.notifications?'checked':''}> Email notifications</label><br><br><button class="btn primary">Save settings</button></form></div>`;$('#sf').onsubmit=async e=>{e.preventDefault();me=await api('/settings',{method:'PUT',body:JSON.stringify({name:$('#sn').value,email:$('#se').value,notifications:$('#nt').checked})});toast('Settings saved');renderApp()}}
function help(c){let faq=['Where does my data live?','Why is a metric blank?','How do I connect a provider?'];c.innerHTML=`<div class="head"><div><h1>${page}</h1><p>Support tools for your workspace.</p></div></div><div class="card panel">${faq.map(q=>`<details style="padding:12px 0;border-bottom:1px solid var(--line)"><summary><b>${q}</b></summary><p class="muted">FlowPilot uses server-side records. Missing metrics are left blank until real data exists. Provider integrations require your own credentials and permissions.</p></details>`).join('')}<div class="field"><label>Message support</label><textarea class="input" rows="5" placeholder="Describe the issue…"></textarea></div><button class="btn primary" onclick="toast('Support request captured locally in this session; connect an email/helpdesk provider for delivery.')">Send</button></div>`}
function modal(html){let d=document.createElement('div');d.className='modal';d.id='modal';d.innerHTML='<div class="modalbox card">'+html+'<br><button class="btn" onclick="closeModal()">Cancel</button></div>';document.body.appendChild(d)}function closeModal(){$('#modal')?.remove()}
window.addEventListener('hashchange',()=>{let h=decodeURIComponent(location.hash.slice(1));if(h==='signup')renderSignup();else if(h==='login')renderAuth();else if(token){page=nav.find(n=>n.toLowerCase().replaceAll(' ','-')===h)||'Dashboard';renderApp()}else renderAuth()});
if(location.hash==='#signup')renderSignup();else if(token)renderApp();else renderAuth();
</script></body></html>
