services:
  - type: web
    name: flowpilot-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: flowpilot-db
          property: connectionString
      # Set this to your live https://xxxx.onrender.com URL after the first
      # deploy (Render shows it on the service page). Needed for CORS.
      - key: FRONTEND_URL
        sync: false

databases:
  - name: flowpilot-db
    plan: free
    databaseName: flowpilot
    user: flowpilot
